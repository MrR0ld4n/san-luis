<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San Luis Visuales</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000; /* Fondo negro por si tardas en cargar */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;

            width: 100vw;

</head>
